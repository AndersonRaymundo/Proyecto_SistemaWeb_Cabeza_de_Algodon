version: '3.8'

services:
  pacientes_service:
    build: ./pacientes_service
    ports:
      - "8000:8000"
    container_name: pacientes_crud_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}

  email_service:
    build: ./email_service
    ports:
      - "8001:8001"
    container_name: email_microservice

  pdf_service:
    build: ./pdf_service
    ports:
      - "8002:8002"
    container_name: pdf_microservice

  historial_medico_service:
    build: ./historial_medico_service
    ports:
      - "8003:8003"
    container_name: historial_medico_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}

  solicitudes_citas_service:
    build: ./solicitudes_citas_service
    ports:
      - "8004:8004"
    container_name: solicitudes_citas_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - EMAIL_SERVICE_URL=http://email_service:8001
    depends_on:
      - email_service

  laboratorio_farmacia_service:
    build: ./laboratorio_farmacia_service
    ports:
      - "8005:8005"
    container_name: laboratorio_farmacia_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}

  caja_service:
    build: ./caja_service
    ports:
      - "8006:8006"
    container_name: caja_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}

  login_service:
    build: ./login_service
    ports:
      - "8007:8007"
    container_name: login_microservice
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
